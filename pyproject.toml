[project]
name = "swarmpot"
version = "0.1.0"
description = "A reproducible evaluation harness for cooperating defender swarms over honeypots"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["swarmpot*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
